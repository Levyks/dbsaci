name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # fmt + clippy + the container-free Rust tests. Runs once; nothing here
  # depends on the PostgreSQL major.
  lint:
    name: rust — fmt + clippy + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib
      - run: cargo test --test translate_golden

  # The end-to-end corpus (real container + real TNS) against every supported
  # PostgreSQL major. Same test binary, three backends.
  corpus:
    name: rust — corpus (PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["18", "16", "13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build postgres ${{ matrix.pg }} + orafce image
        run: docker build --build-arg PG_VERSION=${{ matrix.pg }} -t dbsaci-test-pg:${{ matrix.pg }} testcontainers
      - name: corpus (ledger — failures must match expected-failures.postgres)
        env:
          DBSACI_TEST_PG_IMAGE: dbsaci-test-pg:${{ matrix.pg }}
          DBSACI_CORPUS_LEDGER: "1"
        run: cargo test --test corpus -- --test-threads=1

  # The same end-to-end corpus against MariaDB. Failures must match
  # tests/corpus/expected-failures.mariadb exactly (ledger mode).
  corpus-mariadb:
    name: rust — corpus (MariaDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: corpus (mariadb ledger)
        env:
          DBSACI_CORPUS_BACKEND: mariadb
          DBSACI_CORPUS_LEDGER: "1"
        run: cargo test --test corpus -- --test-threads=1

  # Real third-party Oracle drivers. Assertions are Oracle-correct; with
  # DBSACI_CLIENT_LEDGER=1, failed checks must match clients/expected-failures.
  client-python:
    name: client — python-oracledb (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [postgres, mariadb]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install oracledb
      - if: matrix.backend == 'postgres'
        run: docker build -t dbsaci-test-pg:18 testcontainers
      - run: bash clients/run.sh python
        env:
          DBSACI_CLIENT_BACKEND: ${{ matrix.backend }}
          DBSACI_CLIENT_LEDGER: "1"
      - run: bash clients/run.sh python 11
        env:
          DBSACI_CLIENT_BACKEND: ${{ matrix.backend }}
          DBSACI_CLIENT_LEDGER: "1"

  client-java:
    name: client — ojdbc11 (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [postgres, mariadb]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - if: matrix.backend == 'postgres'
        run: docker build -t dbsaci-test-pg:18 testcontainers
      - run: bash clients/run.sh java
        env:
          DBSACI_CLIENT_BACKEND: ${{ matrix.backend }}
          DBSACI_CLIENT_LEDGER: "1"
      - run: bash clients/run.sh java 11
        env:
          DBSACI_CLIENT_BACKEND: ${{ matrix.backend }}
          DBSACI_CLIENT_LEDGER: "1"

  client-dotnet:
    name: client — ODP.NET Core (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [postgres, mariadb]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - if: matrix.backend == 'postgres'
        run: docker build -t dbsaci-test-pg:18 testcontainers
      - run: bash clients/run.sh dotnet
        env:
          DBSACI_CLIENT_BACKEND: ${{ matrix.backend }}
          DBSACI_CLIENT_LEDGER: "1"
      - run: bash clients/run.sh dotnet 11
        env:
          DBSACI_CLIENT_BACKEND: ${{ matrix.backend }}
          DBSACI_CLIENT_LEDGER: "1"
