[package]
name = "dbsaci"
version = "0.1.1"
edition = "2024"
license = "WTFPL"
description = "An Oracle TNS/TTC wire-protocol proxy for PostgreSQL and MariaDB"
repository = "https://github.com/Levyks/dbsaci"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
async-trait = "0.1"
# `ring` (not `aws-lc-rs`) as the rustls provider: it cross-compiles cleanly to
# `x86_64-unknown-linux-musl`, so the release image stays a static `scratch`
# binary. `default-rustls` pulls `aws-lc-sys`, which needs a musl C toolchain.
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
bytes = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlparser = { version = "0.62", features = ["visitor"] }
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["block-padding", "alloc"] }
pbkdf2 = { version = "0.12", features = ["simple"] }
hmac = "0.12"
hex = "0.4"
rand = "0.8"
chrono = "0.4"
chrono-tz = "0.10"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
socket2 = "0.6"
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
testcontainers = "0.23"
tokio-test = "0.4"
oracle-rs = "0.1"
libtest-mimic = "0.8"

# End-to-end compatibility corpus. Custom harness: one PostgreSQL/orafce
# container and one DbSaci proxy are started once, then every golden-file case
# is streamed across TNS through a single worker connection. See
# `tests/corpus/README.md` for the file format.
[[test]]
name = "corpus"
harness = false

# Pure SQL-translation goldens (`translate::oracle_to_postgres`). No container,
# ordinary libtest harness.
[[test]]
name = "translate_golden"
harness = true

[[test]]
name = "mariadb_smoke"
harness = true

[profile.release]
strip = "symbols"   # drop debuginfo/symbols from the binary
lto = "thin"        # modest size + speed win, safe
